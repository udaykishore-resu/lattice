name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: sbt }
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch scalafmtCheckAll test
      - run: sbt -batch "app/runMain lattice.app.ExportManifests manifests"
      - uses: actions/upload-artifact@v4
        with: { name: graph-manifests, path: manifests/ }

  infra:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx cdk synth -c tenant=demos -c apiDomain=lattice.example.com -c certificateArn=arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000

  image:
    runs-on: ubuntu-latest
    needs: [scala]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: lattice:ci, cache-from: type=gha, cache-to: type=gha,mode=max }
