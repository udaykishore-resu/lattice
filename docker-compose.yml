services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  create-table:
    image: amazon/aws-cli:2.17.0
    depends_on: [dynamodb]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 2 && aws dynamodb create-table --endpoint-url http://dynamodb:8000
        --table-name lattice-executions
        --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S AttributeName=gsi1pk,AttributeType=S AttributeName=gsi1sk,AttributeType=S
        --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
        --global-secondary-indexes 'IndexName=gsi1,KeySchema=[{AttributeName=gsi1pk,KeyType=HASH},{AttributeName=gsi1sk,KeyType=RANGE}],Projection={ProjectionType=ALL}'
        --billing-mode PAY_PER_REQUEST || true

  lattice:
    build: .
    depends_on: [create-table]
    ports: ["8080:8080"]
    environment:
      LATTICE_STORE: dynamo
      LATTICE_TABLE: lattice-executions
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
